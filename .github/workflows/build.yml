name: build

on:
  push:
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the demos with LuaLaTeX
        uses: xu-cheng/latex-action@v3
        env:
          TEXINPUTS: ..//:
        with:
          root_file: |
            lamalunga-demo.tex
            lamalunga-demo-dark.tex
          working_directory: demo
          latexmk_use_lualatex: true
      - name: Compile the demo with pdfLaTeX
        uses: xu-cheng/latex-action@v3
        env:
          TEXINPUTS: ..//:
        with:
          root_file: lamalunga-demo.tex
          working_directory: demo
          args: -pdf -jobname=lamalunga-demo-pdflatex -interaction=nonstopmode -halt-on-error
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demo/*.pdf
